<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        body{
            background-color: bisque;
            margin:0;
        }
        .Main{
            width  : 100vw;
            height : 100vh;
            background-color:white;
            position:relative;
        }
        .Box{
            width:20vw;
            height:40vh;
            border-radius: 30px;
            font-size:20px;
            color:white;
            font-weight: bolder;
            display:flex;
            align-items: center;
            justify-content:center;
            transition: all;
            }
        .Sub1{
            background-color: green;
            position: absolute;
            top:30vh;
            left:4vw;
            }
        .Sub2{
            background-color: yellow;
            position: absolute;
            top:30vh;
            left:28vw;
            }
        .Sub3{
            background-color: red;
            position:absolute;
            top:30vh;
            right:28vw;
            }
        .Sub4{
            background-color: blue;
            position:absolute;
            top:30vh;
            right:4vw;
            }
        .Sub5 img{
            width:100px;
        }
        .Main2{
            width:100vw;
            height:100vh;
            background-color: blueviolet;
        }
        .Sub5{
            position: fixed;
            top:5vh;
            left: 50px;

        }
        .Main:hover .Sub1{
            background-color:white;
            border:5px solid green;
            color:green;
            transform:rotate(-10deg);
            left:8vw;

        }
        .Main:hover .Sub2{
            background-color:white;
            border:5px solid yellow;
            color:yellow;
            transform:rotate(10deg);
            
        }
        .Main:hover .Sub3{
            background-color:white;
            border:5px solid red;
            color:red;
            transform: rotate(-10deg);
            right:32vw;
        }
        .Main:hover .Sub4{
            background-color:white;
            border:5px solid blue;
            color:blue;
            transform: rotate(10deg);
            right:12vw;
        }

    </style>
</head>
